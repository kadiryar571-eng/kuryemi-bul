name: Android APK Derle

# ============================================================
# GÜVENLİK NOTU (önceki sürümdeki kritik hata):
# Bu workflow eskiden `assembleDebug` çalıştırıp çıkan APK'yı
# downloads/kuryemibul.apk olarak siteye yayınlıyordu. Sonuç:
#   1) android:debuggable="true" — ADB ile process'e bağlanıp
#      WebView'den canlı Supabase oturum jetonu okunabiliyordu.
#   2) APK, herkese açık Android DEBUG anahtarıyla imzalıydı
#      (CN=Android Debug, O=Android, C=US) — üçüncü bir kişi
#      "güncelleme" olarak kabul edilecek kötücül bir APK
#      üretebiliyordu.
# Artık yalnız imzalı RELEASE derlenir ve yayınlanır.
#
# GEREKLİ GITHUB SECRETS (Settings → Secrets → Actions):
#   KEYSTORE_BASE64     — release.keystore dosyasının base64'ü
#   KEYSTORE_PASSWORD   — anahtar deposu parolası
#   KEY_ALIAS           — anahtar takma adı
#   KEY_PASSWORD        — anahtar parolası
# Kurulum adımları için: store/keystore-setup-guide.md
# ============================================================

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "APK'yı downloads/ altına yayınla"
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Repoyu çek
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerekli secret'ları doğrula
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          missing=""
          [ -z "$KEYSTORE_BASE64" ]      && missing="$missing KEYSTORE_BASE64"
          [ -z "$KEYSTORE_PASSWORD" ]    && missing="$missing KEYSTORE_PASSWORD"
          [ -z "$KEY_ALIAS" ]            && missing="$missing KEY_ALIAS"
          [ -z "$KEY_PASSWORD" ]         && missing="$missing KEY_PASSWORD"
          [ -z "$GOOGLE_SERVICES_JSON" ] && missing="$missing GOOGLE_SERVICES_JSON"
          if [ -n "$missing" ]; then
            echo "::error::Eksik secret(lar):$missing"
            echo "::error::Kurulum: store/keystore-setup-guide.md"
            echo "::error::İmzasız/debug APK YAYINLANMAZ — derleme durduruldu."
            exit 1
          fi
          echo "Tüm imzalama secret'ları mevcut."

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Java (JDK 17) kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK yolunu ayarla
        run: |
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV

      - name: Build tools / platform yükle
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager \
            "build-tools;35.0.0" \
            "platforms;android-35" \
            "platform-tools" || true

      - name: Bağımlılıkları yükle
        run: npm ci || npm install

      - name: Web varlıklarını + plugin'leri senkronla
        run: npx cap sync android

      - name: Keystore'u çöz
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          # Dosya gerçekten bir JKS/PKCS12 mi? (bozuk base64 erken yakalanır)
          if [ ! -s android/app/release.keystore ]; then
            echo "::error::Keystore çözülemedi — KEYSTORE_BASE64 bozuk olabilir."
            exit 1
          fi

      # google-services.json .gitignore'da (Firebase API anahtarı içeriyor, repo public).
      # Bu adım olmadan google-services eklentisi atlanıyor, APK'da google_app_id
      # kaynağı oluşmuyor ve kullanıcı bildirim iznini verdiği anda uygulama
      # "Default FirebaseApp is not initialized" ile çöküyor.
      - name: google-services.json'u çöz
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::GOOGLE_SERVICES_JSON secret'ı tanımlı değil."
            echo "::error::Firebase yapılandırması olmadan release APK üretilmez — push bildirimleri çöker."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json
          # Geçerli JSON mu ve paket adı doğru mu?
          node -e "
            const j = require('./android/app/google-services.json');
            const pkgs = (j.client || []).map(c => c.client_info.android_client_info.package_name);
            if (!pkgs.includes('com.kuryemibul.app')) {
              console.error('::error::google-services.json paket adı uyuşmuyor: ' + pkgs.join(', '));
              process.exit(1);
            }
            console.log('google-services.json OK — proje: ' + j.project_info.project_id);
          "

      - name: gradlew çalıştırılabilir yap
        run: chmod +x android/gradlew

      - name: APK derle (release, imzalı)
        working-directory: android
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: AAB derle (Play Store için)
        working-directory: android
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: İmzayı ve debuggable bayrağını doğrula
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d /usr/local/lib/android/sdk/build-tools/* | sort -V | tail -1)

          # 1) Debug anahtarıyla imzalanmadığından emin ol
          if "$BT/apksigner" verify --print-certs "$APK" | grep -qi "Android Debug"; then
            echo "::error::APK hâlâ DEBUG anahtarıyla imzalı — yayınlanmayacak."
            exit 1
          fi

          # 2) debuggable bayrağı kapalı olmalı
          if "$BT/aapt" dump badging "$APK" | grep -q "application-debuggable"; then
            echo "::error::APK debuggable — yayınlanmayacak."
            exit 1
          fi

          # 3) Firebase yapılandırması APK'ya girdi mi?
          #    google-services eklentisi atlanırsa derleme SESSİZCE başarılı olur
          #    ama google_app_id kaynağı oluşmaz; kullanıcı bildirim iznini
          #    verdiği anda uygulama çöker. Bu kapı o sessiz hatayı yakalar.
          if ! "$BT/aapt" dump --values resources "$APK" | grep -q "google_app_id"; then
            echo "::error::APK'da google_app_id yok — Firebase yapılandırması eklenmemiş."
            echo "::error::Push bildirimleri açıldığında uygulama çöker. Yayınlanmayacak."
            exit 1
          fi
          echo "Firebase yapılandırması APK'da ✓"

          "$BT/apksigner" verify --verbose "$APK"
          echo "Doğrulama geçti: release imzalı, debuggable değil, Firebase yapılandırılmış."

      - name: Sırları runner'dan sil
        if: always()
        run: rm -f android/app/release.keystore android/app/google-services.json

      - name: Artifact olarak kaydet
        uses: actions/upload-artifact@v4
        with:
          name: kuryemibul-release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Web sitesindeki indirme dosyasını güncelle
        if: ${{ inputs.publish }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk downloads/kuryemibul.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add downloads/kuryemibul.apk
          git diff --staged --quiet || git commit -m "chore: APK güncelle (release, imzalı) [skip ci]"
          git checkout -- .
          git pull --rebase origin main
          git push
