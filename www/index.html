<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">

  <!--
    Content-Security-Policy — host allow-list.
    script-src'de 'unsafe-inline' KALDIRILAMAZ; bu SPA tamamen inline
    onclick= handler'ları üzerine kurulu (screens/*.js). CSP burada
    script *çalıştırmayı* değil, script'in *nereye veri gönderebileceğini*
    kısıtlar: enjekte edilen bir payload çalınan Supabase oturum jetonunu
    saldırgan sunucusuna POST edemez. Asıl XSS savunması util.js'teki
    esc()/escAttr()/escJs() katmanıdır.
  -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src  'self' 'unsafe-inline' https://cdn.jsdelivr.net https://maps.googleapis.com;
    style-src   'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src    'self' https://fonts.gstatic.com data:;
    img-src     'self' data: blob: https://fdszypytpodndtlbuzuz.supabase.co https://maps.googleapis.com https://maps.gstatic.com https://*.googleapis.com https://*.ggpht.com;
    media-src   'self' blob: mediastream:;
    connect-src 'self' https://fdszypytpodndtlbuzuz.supabase.co wss://fdszypytpodndtlbuzuz.supabase.co https://maps.googleapis.com;
    frame-src   'none';
    object-src  'none';
    base-uri    'self';
    form-action 'self';
  ">

  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2563EB">
  <title>KuryemiBul</title>
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
  <div id="splash" class="splash">
    <div class="splash-logo">
      <img src="assets/logo.png" alt="KuryemiBul" width="72" height="72" onerror="this.style.display='none'">
    </div>
    <div class="splash-brand">KuryemiBul</div>
    <div class="splash-sub">Doğru kurye, doğru firma, doğru eşleşme.</div>
  </div>

  <div id="kb-layout" class="kb-layout" style="display:none">
    <header id="kb-appbar" class="kb-appbar" style="display:none"></header>
    <main id="kb-screen" class="kb-screen"></main>
    <nav id="kb-bottomnav" class="kb-bottomnav" style="display:none"></nav>
  </div>

  <!-- util.js EN ÖNCE: esc()/escAttr()/escJs() tüm screens/* modüllerinden
       önce hazır olmalı — render sırasında çağrılıyorlar. -->
  <script src="assets/js/util.js"></script>

  <script>window._spmMapsReady=false;</script>
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDIs6NXw-WTa5O_JPJX1cRlVOvHJfoFpjU&libraries=visualization&callback=__spmMapsReady" async defer></script>
  <script>function __spmMapsReady(){window._spmMapsReady=true;if(window.initPremiumMap&&window._spmPendingRole){var r=window._spmPendingRole;window._spmPendingRole=null;setTimeout(function(){window.initPremiumMap(r);},200);}}</script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.2/dist/umd/supabase.js" integrity="sha384-OUpie84zd1LdwNlK9uJJQRwab0BLqo3eKYKFh7hSVL58FSk7wPp2l0kfUMIIoaQd" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="assets/js/supabase.js"></script>
  <script src="assets/js/router.js"></script>
  <script src="assets/js/screens/shared.js"></script>
  <script src="assets/js/screens/login.js"></script>
  <script src="assets/js/screens/kurye.js"></script>
  <script src="assets/js/screens/firma.js"></script>
  <script src="assets/js/screens/isletme.js"></script>
  <script src="assets/js/native.js"></script>
  <script src="assets/js/webrtc.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
