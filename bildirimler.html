<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <!-- Content-Security-Policy — host allow-list.
       'unsafe-inline' kaldırılamaz (site inline onclick= handler'larına dayanır);
       asıl XSS savunması KB.esc()'tir. CSP burada veri sızdırmayı engeller:
       enjekte edilen kod çalınan oturum jetonunu dış sunucuya POST edemez. -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src  'self' 'unsafe-inline' https://cdn.jsdelivr.net https://maps.googleapis.com;
    style-src   'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src    'self' https://fonts.gstatic.com data:;
    img-src     'self' data: blob: https://fdszypytpodndtlbuzuz.supabase.co https://maps.googleapis.com https://maps.gstatic.com https://*.googleapis.com https://*.ggpht.com;
    media-src   'self' blob: mediastream:;
    connect-src 'self' https://fdszypytpodndtlbuzuz.supabase.co wss://fdszypytpodndtlbuzuz.supabase.co https://maps.googleapis.com;
    frame-src   'none';
    object-src  'none';
    base-uri    'self';
    form-action 'self';
  ">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bildirimler · KuryemiBul</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/logo.png" sizes="any">
  <link rel="apple-touch-icon" href="assets/logo.png">
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>

  <div id="app-topbar"></div>
  <div id="sidebar-overlay"></div>
  <nav id="app-sidebar"></nav>

  <div class="app-content">

    <div class="page-header">
      <div>
        <h1>Bildirimler</h1>
        <p class="page-sub">Başvuru, görüşme, mesaj ve karar güncellemeleri.</p>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="btn btn--ghost btn--sm" id="btnMarkAll">Tümünü Okundu Say</button>
        <button class="btn btn--ghost btn--sm" id="btnClearAll" style="color:var(--error)">Tümünü Sil</button>
      </div>
    </div>

    <!-- Filter pills -->
    <div class="iv-filter-bar" id="notifFilterBar" style="margin-bottom:16px">
      <button class="iv-filter-pill is-active" data-filter="all">Tümü</button>
      <button class="iv-filter-pill" data-filter="basvuru">📋 Başvuru</button>
      <button class="iv-filter-pill" data-filter="gorusme">📅 Görüşme</button>
      <button class="iv-filter-pill" data-filter="karar">⚖️ Karar</button>
      <button class="iv-filter-pill" data-filter="mesaj">💬 Mesaj</button>
      <button class="iv-filter-pill" data-filter="teklif">✉️ Teklif</button>
      <button class="iv-filter-pill" data-filter="geri">⭐ Geri Bildirim</button>
    </div>

    <!-- Stats row -->
    <div class="iv-stats" id="notifStats" style="margin-bottom:16px"></div>

    <!-- List -->
    <div class="panel-box">
      <div class="panel-box__body" style="padding:0">
        <div id="notifList">
          <div class="skel-card"><span class="skel skel--line" style="width:80%"></span><span class="skel skel--line" style="width:40%;margin-top:8px"></span></div>
          <div class="skel-card" style="margin-top:4px"><span class="skel skel--line" style="width:70%"></span><span class="skel skel--line" style="width:35%;margin-top:8px"></span></div>
          <div class="skel-card" style="margin-top:4px"><span class="skel skel--line" style="width:75%"></span><span class="skel skel--line" style="width:45%;margin-top:8px"></span></div>
        </div>
      </div>
    </div>

  </div>

  <div id="app-footer"></div>

  <script src="assets/js/i18n.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.2/dist/umd/supabase.js" integrity="sha384-OUpie84zd1LdwNlK9uJJQRwab0BLqo3eKYKFh7hSVL58FSk7wPp2l0kfUMIIoaQd" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="assets/js/supabase.js"></script>
  <script src="assets/js/presence.js"></script>
  <script src="assets/js/components.js"></script>
  <script src="assets/js/notifications.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/motion.js"></script>

  <script>
  (function () {
    'use strict';

    /* Bildirimler TAMAMEN veritabanından gelir (public.notifications).
       Sahte/örnek bildirim yoktur; her satır gerçek bir olaydan doğar. */
    var ACTIVE_FILTER = 'all';
    var CACHE = [];

    function renderStats() {
      var unread = CACHE.filter(function (n) { return !n.read; }).length;
      var el = document.getElementById('notifStats');
      if (!el) return;
      el.innerHTML =
        '<div class="iv-stat"><div class="iv-stat__num">' + CACHE.length + '</div><div class="iv-stat__lbl">Toplam</div></div>' +
        '<div class="iv-stat"><div class="iv-stat__num">' + unread + '</div><div class="iv-stat__lbl">Okunmamış</div></div>' +
        '<div class="iv-stat"><div class="iv-stat__num">' + (CACHE.length - unread) + '</div><div class="iv-stat__lbl">Okunmuş</div></div>';
    }

    function renderList() {
      var el = document.getElementById('notifList');
      if (!el) return;
      var list = ACTIVE_FILTER === 'all'
        ? CACHE : CACHE.filter(function (n) { return n.type === ACTIVE_FILTER; });

      if (!list.length) {
        el.innerHTML =
          '<div class="notif-empty">' +
            '<div class="notif-empty__ic">🔔</div>' +
            '<div class="notif-empty__t">Bildirim yok</div>' +
            '<p style="color:var(--text-2);font-size:0.85rem">Yeni başvuru, görüşme ve mesajlar burada görünür.</p>' +
          '</div>';
        return;
      }
      el.innerHTML = '<div class="notif-list">' + list.map(function (n) {
        return KBNotif.renderItem(n);
      }).join('') + '</div>';
    }

    async function render() {
      CACHE = await KBNotif.getAll();
      renderStats();
      renderList();
    }

    function wire() {
      /* Filtre */
      document.getElementById('notifFilterBar').addEventListener('click', function (e) {
        var pill = e.target.closest('[data-filter]');
        if (!pill) return;
        ACTIVE_FILTER = pill.dataset.filter;
        document.querySelectorAll('.iv-filter-pill').forEach(function (p) {
          p.classList.toggle('is-active', p.dataset.filter === ACTIVE_FILTER);
        });
        renderList();
      });

      /* Liste aksiyonları */
      document.getElementById('notifList').addEventListener('click', async function (e) {
        var readBtn = e.target.closest('[data-read]');
        var delBtn  = e.target.closest('[data-del]');
        var item    = e.target.closest('.notif-item--link');

        if (readBtn) {
          await KBNotif.markRead(readBtn.dataset.read);
          await render();
          return;
        }
        if (delBtn) {
          await KBNotif.remove(delBtn.dataset.del);
          await render();
          return;
        }
        if (item) {
          var href = item.dataset.href;
          await KBNotif.markRead(item.dataset.nid);
          if (href) window.location.href = href;
        }
      });

      document.getElementById('btnMarkAll').addEventListener('click', async function () {
        await KBNotif.markAllRead();
        await render();
      });

      document.getElementById('btnClearAll').addEventListener('click', async function () {
        if (!confirm('Tüm bildirimler silinecek. Emin misiniz?')) return;
        await KBNotif.clear();
        await render();
      });
    }

    async function boot() {
      await render();
      wire();
      /* CANLI: yeni bildirim gelince liste anında güncellenir */
      if (KBNotif.onNew) KBNotif.onNew(function () { render(); });
      if (KBNotif.subscribe) KBNotif.subscribe();
    }

    if (window.KB && KB.ready) {
      KB.ready().then(boot).catch(boot);
    } else {
      document.addEventListener('DOMContentLoaded', boot);
    }
  })();
  </script>
</body>
</html>
