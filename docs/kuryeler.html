<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <!-- Content-Security-Policy — host allow-list.
       'unsafe-inline' kaldırılamaz (site inline onclick= handler'larına dayanır);
       asıl XSS savunması KB.esc()'tir. CSP burada veri sızdırmayı engeller:
       enjekte edilen kod çalınan oturum jetonunu dış sunucuya POST edemez. -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src  'self' 'unsafe-inline' https://cdn.jsdelivr.net;
    style-src   'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src    'self' https://fonts.gstatic.com data:;
    img-src     'self' data: blob: https://fdszypytpodndtlbuzuz.supabase.co;
    media-src   'self' blob: mediastream:;
    connect-src 'self' https://fdszypytpodndtlbuzuz.supabase.co wss://fdszypytpodndtlbuzuz.supabase.co;
    frame-src   'none';
    object-src  'none';
    base-uri    'self';
    form-action 'self';
  ">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kurye Havuzu · KuryemiBul</title>
  <meta name="description" content="Bölge, şehir ve araç tipine göre kurye ara.">
  <link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="assets/favicon-64.png" sizes="64x64" type="image/png">
  <link rel="icon" href="assets/logo.png" sizes="any">
  <link rel="apple-touch-icon" href="assets/logo.png">
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>

  <div id="app-topbar"></div>
  <div id="sidebar-overlay"></div>
  <nav id="app-sidebar"></nav>

  <div class="app-content">

    <div class="page-header page-header--row">
      <div>
        <h1>Kurye Havuzu</h1>
        <p class="page-sub">Bölge, şehir ve araç tipine göre kurye bul.</p>
      </div>
      <div class="page-header__actions">
        <a href="harita.html?type=kurye" class="btn btn--ghost btn--sm">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
          Haritada Gör
        </a>
        <button class="btn btn--ghost btn--sm" id="btnToggleView" title="Görünüm değiştir">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
          Liste
        </button>
      </div>
    </div>

    <!-- Havuz özet şeridi -->
    <div class="pool-stats-bar" id="poolStatsBanner">
      <span class="pool-stats-bar__main">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        <span id="resultCount">Yükleniyor…</span>
      </span>
      <!-- Burada "Match skoru: Profilinize göre hesaplanır" yazıyordu.
           Böyle bir hesap YOK: kurye kartları .match-score elemanı hiç
           basmıyor, KBPrefs.matchScore() ise iş ilanları için çalışıyor
           (çalışma tipi/sektör/maaş/vardiya) ve prefs.js bu sayfaya zaten
           yüklenmiyor. Kullanıcıya olmayan bir özellik vaat ediliyordu. -->
      <span class="pool-stats-bar__note">Yalnızca profilini tamamlamış kuryeler listelenir</span>
    </div>

    <!-- Filter bar -->
    <div class="filter-bar">
      <!-- Konumlandırma ve padding main.css'teki .filter-bar .search-wrap
           kurallarından gelir; burada tekrar edilmez. -->
      <div class="search-wrap">
        <span class="search-ico">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        </span>
        <input type="search" id="fSearch" placeholder="İsim, şehir, bölge ara…" autocomplete="off">
        <div class="suggest-box" id="poolSuggest"></div>
      </div>
      <select id="fSelect1"><option value="">Tüm Şehirler</option></select>
      <select id="fSelect3" onchange="filterByArac(this.value)">
        <option value="">Tüm Araçlar</option>
        <option value="Motosiklet">🛵 Motosiklet</option>
        <option value="Bisiklet">🚲 Bisiklet</option>
        <option value="Elektrikli Bisiklet">⚡ E-Bisiklet</option>
        <option value="Araç">🚗 Araç</option>
        <option value="Yaya">🚶 Yaya</option>
      </select>
      <!-- "Match Skoru" seçeneği KALDIRILDI — arkasında hesap yoktu ve
           VARSAYILAN seçenek olduğu için sayfa hiçbir zaman sıralanmıyordu.
           Kalan seçeneklerin hepsi gerçek profil alanlarına dayanır. -->
      <select id="fSort" onchange="sortPool(this.value)">
        <option value="rating">En Yüksek Puan</option>
        <option value="experience">En Deneyimli</option>
        <option value="deliveries">En Çok Teslimat</option>
        <option value="newest">En Yeni Üye</option>
      </select>
    </div>

    <!-- Active filter chips -->
    <div class="active-chips" id="poolChips"></div>

    <!-- Result count -->

    <!-- Card grid -->
    <div class="cards-grid" id="poolGrid">
      <div class="skel-card"><div class="skel-card__top"><span class="skel skel--ava"></span><span class="skel-card__body"><span class="skel skel--line"></span><span class="skel skel--line"></span></span></div><span class="skel skel--chips"></span></div>
      <div class="skel-card"><div class="skel-card__top"><span class="skel skel--ava"></span><span class="skel-card__body"><span class="skel skel--line"></span><span class="skel skel--line"></span></span></div><span class="skel skel--chips"></span></div>
      <div class="skel-card"><div class="skel-card__top"><span class="skel skel--ava"></span><span class="skel-card__body"><span class="skel skel--line"></span><span class="skel skel--line"></span></span></div><span class="skel skel--chips"></span></div>
      <div class="skel-card"><div class="skel-card__top"><span class="skel skel--ava"></span><span class="skel-card__body"><span class="skel skel--line"></span><span class="skel skel--line"></span></span></div><span class="skel skel--chips"></span></div>
      <div class="skel-card"><div class="skel-card__top"><span class="skel skel--ava"></span><span class="skel-card__body"><span class="skel skel--line"></span><span class="skel skel--line"></span></span></div><span class="skel skel--chips"></span></div>
      <div class="skel-card"><div class="skel-card__top"><span class="skel skel--ava"></span><span class="skel-card__body"><span class="skel skel--line"></span><span class="skel skel--line"></span></span></div><span class="skel skel--chips"></span></div>
    </div>

    <!-- NOT: "Daha Fazla Göster" bloğu KALDIRILDI. #loadMoreWrap ve
         #btnLoadMore hiçbir JS dosyasında geçmiyordu — butona basınca hiçbir
         şey olmuyordu. Üstelik sarmalayıcıda iki ayrı stil niteliği vardı
         (biri hizalama, diğeri gizleme); HTML ayrıştırıcı ikinciyi yok
         saydığı için gizleme hiç çalışmıyor, ölü buton her zaman
         görünüyordu. Havuz listesi zaten tümünü tek seferde basıyor. -->

  </div>

  <div id="app-footer"></div>

  <script src="assets/js/i18n.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.2/dist/umd/supabase.js" integrity="sha384-OUpie84zd1LdwNlK9uJJQRwab0BLqo3eKYKFh7hSVL58FSk7wPp2l0kfUMIIoaQd" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="assets/js/supabase.js"></script>
  <script src="assets/js/presence.js"></script>
  <script src="assets/js/components.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/motion.js"></script>
  <script src="assets/js/push.js"></script>
  <script>
  (function () {
    'use strict';

    var isListView = false;

    /* ── Görünüm değiştirici (grid ↔ liste) ────────────────
       Buton metnini textContent ile yazmak İKONU SİLİYORDU: HTML'de
       gelen <svg> ilk tıklamada yok oluyor, geri dönüşü olmuyordu.
       Yalnız etiketi güncelliyoruz. */
    var toggleBtn   = document.getElementById('btnToggleView');
    var toggleLabel = null;
    if (toggleBtn) {
      /* Metin düğümünü bul (svg'den sonraki) */
      [].forEach.call(toggleBtn.childNodes, function (n) {
        if (n.nodeType === 3 && n.textContent.trim()) toggleLabel = n;
      });

      function setView(list) {
        isListView = list;
        var grid = document.getElementById('poolGrid');
        if (grid) grid.classList.toggle('cards-grid--list', isListView);
        if (toggleLabel) toggleLabel.textContent = isListView ? ' Grid' : ' Liste';
        toggleBtn.setAttribute('aria-pressed', String(isListView));
        try { localStorage.setItem('kb_pool_view_kurye', isListView ? 'list' : 'grid'); } catch (e) {}
      }

      toggleBtn.addEventListener('click', function () { setView(!isListView); });

      /* Kayıtlı görünümü geri yükle.
         Eskiden bunun için toggleBtn.click() çağrılıyordu; tıklama
         localStorage'a yeniden yazdığı için zararsızdı ama niyeti
         gizliyordu. Doğrudan uygula. */
      try { if (localStorage.getItem('kb_pool_view_kurye') === 'list') setView(true); } catch (e) {}
    }

    /* ── Araç süzmesi ve sıralama ──────────────────────────
       İkisi de app.js'e devredilir. Burada eskiden render EDİLMİŞ kartlar
       üzerinde çalışan bir kopya vardı; app.js grid'i her yeniden
       yazdığında (arama, şehir filtresi, canlı abonelik) sessizce
       siliniyordu. Ayrıntı: app.js → POOLV. */
    window.filterByArac = function (val) {
      if (window.KBApp && KBApp.setPoolArac) KBApp.setPoolArac(val);
    };
    window.sortPool = function (mode) {
      if (window.KBApp && KBApp.setPoolSort) KBApp.setPoolSort(mode);
    };

    document.addEventListener('DOMContentLoaded', function () {
      if (window.KBApp && KBApp.renderPool) {
        /* Sonuç sayısını app.js doğrudan şeritteki #resultCount
           elemanına yazıyor; ayrı bir kopyalama gerekmiyor. */
        /* İkinci argüman: menüde seçili gelen sıralama. */
        KBApp.renderPool('kurye', 'rating');
      }
    });
  })();
  </script>
</body>
</html>
