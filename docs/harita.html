<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <!-- Content-Security-Policy — host allow-list.
       'unsafe-inline' kaldırılamaz (site inline onclick= handler'larına dayanır);
       asıl XSS savunması KB.esc()'tir. CSP burada veri sızdırmayı engeller:
       enjekte edilen kod çalınan oturum jetonunu dış sunucuya POST edemez. -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src  'self' 'unsafe-inline' https://cdn.jsdelivr.net;
    style-src   'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src    'self' https://fonts.gstatic.com data:;
    img-src     'self' data: blob: https://fdszypytpodndtlbuzuz.supabase.co https://tiles.openfreemap.org;
    media-src   'self' blob: mediastream:;
    connect-src 'self' https://fdszypytpodndtlbuzuz.supabase.co wss://fdszypytpodndtlbuzuz.supabase.co https://tiles.openfreemap.org;
    frame-src   'none';
    worker-src  blob:;
    object-src  'none';
    base-uri    'self';
    form-action 'self';
  ">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harita · KuryemiBul</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/logo.png" sizes="any">
  <link rel="apple-touch-icon" href="assets/logo.png">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/vendor/maplibre/maplibre-gl.css">
  <style>
    .map-wrap { position: relative; }
    #map {
      width: 100%;
      height: calc(100vh - var(--topbar-h) - 180px);
      min-height: 440px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--border);
      background: var(--bg);
    }
    .map-filters {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .map-filter-lbl {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px 14px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-full);
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      user-select: none;
      transition: border-color .15s, background .15s;
    }
    .map-filter-lbl:has(input:checked) {
      border-color: var(--primary);
      background: #f0f4ff;
      color: var(--primary);
    }
    .map-filter-lbl input { display: none; }
    .map-locate-btn {
      position: absolute;
      bottom: 24px;
      right: 14px;
      z-index: 5;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--surface);
      border: 1.5px solid var(--border);
      box-shadow: 0 2px 8px rgba(0,0,0,.14);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-2);
      transition: color .15s, border-color .15s;
    }
    .map-locate-btn:hover { color: var(--primary); border-color: var(--primary); }
    .map-locate-btn.locating { color: var(--primary); animation: spin .9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .map-legend {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-top: 12px;
      font-size: 0.8rem;
      color: var(--text-2);
    }
    .map-legend__dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 4px;
      vertical-align: middle;
    }
  </style>
</head>
<body>

  <div id="app-topbar"></div>
  <div id="sidebar-overlay"></div>
  <nav id="app-sidebar"></nav>

  <div class="app-content">
    <div class="page-header">
      <h1>Harita</h1>
      <p class="page-sub">Türkiye genelinde kurye, işletme ve firmaları haritada keşfet.</p>
    </div>

    <!-- Katman filtreleri -->
    <div class="map-filters">
      <label class="map-filter-lbl">
        <input type="checkbox" data-layer="kurye" checked>
        🛵 Kuryeler
      </label>
      <label class="map-filter-lbl">
        <input type="checkbox" data-layer="isletme" checked>
        📦 Esnaflar
      </label>
      <label class="map-filter-lbl">
        <input type="checkbox" data-layer="firma" checked>
        🏢 Kurye Firmaları
      </label>
    </div>

    <!-- Harita alanı -->
    <div class="map-wrap">
      <div id="map"></div>
      <!-- Konumum butonu -->
      <button class="map-locate-btn" id="locateBtn" title="Konumumu göster" aria-label="Konumumu göster">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
          <circle cx="12" cy="12" r="9"/>
        </svg>
      </button>
    </div>

    <!-- Açıklama -->
    <div class="map-legend">
      <span><span class="map-legend__dot" style="background:#22D3EE"></span>Kurye</span>
      <span><span class="map-legend__dot" style="background:#4f8bff"></span>Esnaf</span>
      <span><span class="map-legend__dot" style="background:#a855f7"></span>Kurye Firması</span>
    </div>
  </div>

  <div id="app-footer"></div>

  <script src="assets/js/i18n.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.2/dist/umd/supabase.js" integrity="sha384-OUpie84zd1LdwNlK9uJJQRwab0BLqo3eKYKFh7hSVL58FSk7wPp2l0kfUMIIoaQd" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="assets/js/supabase.js"></script>
  <script src="assets/js/presence.js"></script>
  <script src="assets/js/components.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/motion.js"></script>
  <script src="assets/js/push.js"></script>

  <script src="assets/vendor/maplibre/maplibre-gl.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      if (window.KBApp && KBApp.initMap) KBApp.initMap();
    });
  </script>
</body>
</html>
