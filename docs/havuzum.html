<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <!-- Content-Security-Policy — host allow-list.
       'unsafe-inline' kaldırılamaz (site inline onclick= handler'larına dayanır);
       asıl XSS savunması KB.esc()'tir. CSP burada veri sızdırmayı engeller:
       enjekte edilen kod çalınan oturum jetonunu dış sunucuya POST edemez. -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src  'self' 'unsafe-inline' https://cdn.jsdelivr.net;
    style-src   'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src    'self' https://fonts.gstatic.com data:;
    img-src     'self' data: blob: https://fdszypytpodndtlbuzuz.supabase.co;
    media-src   'self' blob: mediastream:;
    connect-src 'self' https://fdszypytpodndtlbuzuz.supabase.co wss://fdszypytpodndtlbuzuz.supabase.co;
    frame-src   'none';
    object-src  'none';
    base-uri    'self';
    form-action 'self';
  ">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Havuzum · KuryemiBul</title>
  <link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="assets/favicon-64.png" sizes="64x64" type="image/png">
  <link rel="icon" href="assets/logo.png" sizes="any">
  <link rel="apple-touch-icon" href="assets/logo.png">
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>

  <div id="app-topbar"></div>
  <div id="sidebar-overlay"></div>
  <nav id="app-sidebar"></nav>

  <div class="app-content">
    <div class="page-header">
      <h1>Havuzum</h1>
      <p class="page-sub">Kaydettiğiniz profiller ve ilanlar.</p>
    </div>

    <!-- Sekmeler -->
    <div class="tab-bar mb-24" id="havuzumTabs">
      <button class="tab-btn is-active" data-tab="profiller">Profiller</button>
      <button class="tab-btn" data-tab="ilanlar">İlanlar</button>
    </div>

    <!-- Profiller sekmesi -->
    <div id="tabProfiller">
      <div class="section-head-row">
        <span class="text-sm text-muted" id="myPoolCount"></span>
      </div>
      <div class="cards-grid" id="myPoolGrid">
        <div class="skel-card"><div class="skel-card__top"><span class="skel skel--ava"></span><span class="skel-card__body"><span class="skel skel--line"></span><span class="skel skel--line"></span></span></div><span class="skel skel--chips"></span></div>
        <div class="skel-card"><div class="skel-card__top"><span class="skel skel--ava"></span><span class="skel-card__body"><span class="skel skel--line"></span><span class="skel skel--line"></span></span></div><span class="skel skel--chips"></span></div>
        <div class="skel-card"><div class="skel-card__top"><span class="skel skel--ava"></span><span class="skel-card__body"><span class="skel skel--line"></span><span class="skel skel--line"></span></span></div><span class="skel skel--chips"></span></div>
      </div>
    </div>

    <!-- İlanlar sekmesi (gizli) -->
    <div id="tabIlanlar" style="display:none">
      <div class="section-head-row">
        <span class="text-sm text-muted" id="savedJobsCount"></span>
        <select id="savedSort" class="input select--inline">
          <option value="new">En yeni</option>
          <option value="company">Firmaya göre</option>
          <option value="location">Şehre göre</option>
        </select>
      </div>
      <div class="cards-grid" id="savedJobsGrid">
        <div class="skel-card skel-card--tall"></div>
        <div class="skel-card skel-card--tall"></div>
        <div class="skel-card skel-card--tall"></div>
      </div>
    </div>
  </div>

  <div id="app-footer"></div>

  <script src="assets/js/i18n.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.2/dist/umd/supabase.js" integrity="sha384-OUpie84zd1LdwNlK9uJJQRwab0BLqo3eKYKFh7hSVL58FSk7wPp2l0kfUMIIoaQd" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="assets/js/supabase.js"></script>
  <script src="assets/js/presence.js"></script>
  <script src="assets/js/components.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/motion.js"></script>
  <script src="assets/js/push.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      /* Sekme geçişi */
      var tabs = document.querySelectorAll('#havuzumTabs .tab-btn');
      var pnlProfiller = document.getElementById('tabProfiller');
      var pnlIlanlar = document.getElementById('tabIlanlar');
      var jobsLoaded = false;

      tabs.forEach(function (btn) {
        btn.addEventListener('click', function () {
          tabs.forEach(function (b) { b.classList.remove('is-active'); });
          btn.classList.add('is-active');
          var tab = btn.dataset.tab;
          pnlProfiller.style.display = tab === 'profiller' ? '' : 'none';
          pnlIlanlar.style.display = tab === 'ilanlar' ? '' : 'none';
          if (tab === 'ilanlar' && !jobsLoaded) {
            jobsLoaded = true;
            if (window.KBApp && KBApp.renderSavedJobs) KBApp.renderSavedJobs();
          }
        });
      });

      /* İlk yükleme: profil havuzu */
      if (window.KBApp && KBApp.renderMyPool) KBApp.renderMyPool();
    });
  </script>
</body>
</html>
