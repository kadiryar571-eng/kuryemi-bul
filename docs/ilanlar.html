<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <!-- Content-Security-Policy — host allow-list.
       'unsafe-inline' kaldırılamaz (site inline onclick= handler'larına dayanır);
       asıl XSS savunması KB.esc()'tir. CSP burada veri sızdırmayı engeller:
       enjekte edilen kod çalınan oturum jetonunu dış sunucuya POST edemez. -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src  'self' 'unsafe-inline' https://cdn.jsdelivr.net;
    style-src   'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src    'self' https://fonts.gstatic.com data:;
    img-src     'self' data: blob: https://fdszypytpodndtlbuzuz.supabase.co;
    media-src   'self' blob: mediastream:;
    connect-src 'self' https://fdszypytpodndtlbuzuz.supabase.co wss://fdszypytpodndtlbuzuz.supabase.co;
    frame-src   'none';
    object-src  'none';
    base-uri    'self';
    form-action 'self';
  ">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>İş İlanları · KuryemiBul</title>
  <meta name="description" content="Kurye iş ilanlarını incele, başvur.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/logo.png" sizes="any">
  <link rel="apple-touch-icon" href="assets/logo.png">
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>

  <div id="app-topbar"></div>
  <div id="sidebar-overlay"></div>
  <nav id="app-sidebar"></nav>

  <div class="app-content">
    <div class="page-header page-header--row">
      <div>
        <h1>İş İlanları</h1>
        <p class="page-sub">Açık kurye ilanlarını incele ve başvur.</p>
      </div>
      <div class="page-header__actions">
        <span class="text-sm text-muted" id="listingsCount"></span>
        <a href="ilan-olustur.html" class="btn btn--primary btn--sm" id="btnCreateListing" style="display:none">+ İlan Oluştur</a>
      </div>
    </div>

    <!-- Filtre çubuğu -->
    <div class="filter-bar">
      <div class="search-wrap">
        <span class="search-ico">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        </span>
        <input type="search" id="jobSearch" placeholder="Pozisyon, firma, şehir ara…" autocomplete="off">
        <div class="suggest-box" id="jobSuggest"></div>
      </div>
      <select id="jobCity"><option value="">Tüm Şehirler</option></select>
      <select id="jobVehicle"><option value="">Tüm Araçlar</option></select>
      <select id="jobSort">
        <option value="new">En Yeni</option>
        <option value="old">En Eski</option>
        <option value="match">Uyum</option>
      </select>
    </div>

    <!-- Aktif filtre chipleri -->
    <div class="active-chips" id="jobChips"></div>

    <!-- İlan grid -->
    <div class="cards-grid" id="listingsGrid">
      <div class="skel-card"><div class="skel-card__top"><span class="skel skel--ava skel--ava-sq"></span><span class="skel-card__body"><span class="skel skel--line"></span><span class="skel skel--line"></span></span></div><span class="skel skel--line skel--line-wide"></span><span class="skel skel--chips"></span></div>
      <div class="skel-card"><div class="skel-card__top"><span class="skel skel--ava skel--ava-sq"></span><span class="skel-card__body"><span class="skel skel--line"></span><span class="skel skel--line"></span></span></div><span class="skel skel--line skel--line-wide"></span><span class="skel skel--chips"></span></div>
      <div class="skel-card"><div class="skel-card__top"><span class="skel skel--ava skel--ava-sq"></span><span class="skel-card__body"><span class="skel skel--line"></span><span class="skel skel--line"></span></span></div><span class="skel skel--line skel--line-wide"></span><span class="skel skel--chips"></span></div>
    </div>
  </div>

  <div id="app-footer"></div>

  <script src="assets/js/i18n.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.2/dist/umd/supabase.js" integrity="sha384-OUpie84zd1LdwNlK9uJJQRwab0BLqo3eKYKFh7hSVL58FSk7wPp2l0kfUMIIoaQd" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="assets/js/supabase.js"></script>
  <script src="assets/js/presence.js"></script>
  <script src="assets/js/components.js"></script>
  <script src="assets/js/prefs.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/motion.js"></script>
  <script src="assets/js/push.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      if (window.KBApp && KBApp.renderListings) KBApp.renderListings();

      /* İlan Oluştur butonu — giriş yapmış herkese göster */
      var createBtn = document.getElementById('btnCreateListing');
      if (createBtn && window.KB) {
        KB.ready().then(function () {
          var role = KB.getRole ? KB.getRole() : '';
          if (role && role !== 'guest') createBtn.style.display = 'inline-flex';
        });
      }

      /* Tercih banner — kullanıcının tercihleri varsa filtre çubuğu üstünde göster */
      if (window.KBPrefs && KBPrefs.hasPrefs()) {
        var filterBar = document.querySelector('.filter-bar');
        if (filterBar) {
          var banner = document.createElement('div');
          banner.className = 'pref-banner';
          banner.innerHTML =
            '<span class="pref-banner__ico">⚙️</span>' +
            '<div class="pref-banner__body">' +
              '<div class="pref-banner__title">Tercihleriniz aktif</div>' +
              '<div class="pref-banner__sub">İlanlar çalışma tercihlerinize göre puanlanıyor</div>' +
            '</div>' +
            '<span class="pref-banner__btn">Uyuma Göre Sırala</span>';
          banner.addEventListener('click', function () {
            var sel = document.getElementById('jobSort');
            if (sel) { sel.value = 'match'; sel.dispatchEvent(new Event('change')); }
          });
          filterBar.parentNode.insertBefore(banner, filterBar);
        }
      }
    });
  </script>
</body>
</html>
