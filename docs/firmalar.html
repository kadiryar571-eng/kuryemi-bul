<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <!-- Content-Security-Policy — host allow-list.
       'unsafe-inline' kaldırılamaz (site inline onclick= handler'larına dayanır);
       asıl XSS savunması KB.esc()'tir. CSP burada veri sızdırmayı engeller:
       enjekte edilen kod çalınan oturum jetonunu dış sunucuya POST edemez. -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src  'self' 'unsafe-inline' https://cdn.jsdelivr.net;
    style-src   'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src    'self' https://fonts.gstatic.com data:;
    img-src     'self' data: blob: https://fdszypytpodndtlbuzuz.supabase.co;
    media-src   'self' blob: mediastream:;
    connect-src 'self' https://fdszypytpodndtlbuzuz.supabase.co wss://fdszypytpodndtlbuzuz.supabase.co;
    frame-src   'none';
    object-src  'none';
    base-uri    'self';
    form-action 'self';
  ">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kurye Firmaları · KuryemiBul</title>
  <meta name="description" content="Toplu kurye hizmeti veren firmaları bul.">
  <link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="assets/favicon-64.png" sizes="64x64" type="image/png">
  <link rel="icon" href="assets/logo.png" sizes="any">
  <link rel="apple-touch-icon" href="assets/logo.png">
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>

  <div id="app-topbar"></div>
  <div id="sidebar-overlay"></div>
  <nav id="app-sidebar"></nav>

  <div class="app-content">

    <!-- page-header--row EKLENDİ — bu sınıf olmadan .page-header'ın flex'i
         yok (main.css:765 yalnız margin veriyor), aksiyon düğmeleri
         başlığın sağına değil ALTINA düşüyordu. -->
    <div class="page-header page-header--row">
      <div>
        <h1>Kurye Firmaları</h1>
        <p class="page-sub">Toplu kurye hizmeti veren firmaları keşfet.</p>
      </div>
      <div class="page-header__actions">
        <a href="harita.html?type=firma" class="btn btn--ghost btn--sm">🗺 Haritada Gör</a>
        <button class="btn btn--ghost btn--sm" id="btnToggleView" title="Görünüm değiştir">⊟ Liste</button>
      </div>
    </div>

    <!-- Stats banner -->
    <div class="pool-stats-bar">
      <span class="pool-stats-bar__main"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> <span id="resultCount">Yükleniyor…</span></span>
      <!-- "Kapasiteye ve değerlendirmeye göre sıralanır" yazıyordu —
           SB.pool() yalnız puana göre sıralıyor ve sıralama menüsündeki
           seçeneklerin hiçbiri zaten çalışmıyordu. -->
      <span class="pool-stats-bar__note">Yalnızca profilini tamamlamış firmalar listelenir</span>
    </div>

    <div class="filter-bar">
      <div class="search-wrap">
        <span class="search-ico">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        </span>
        <input type="search" id="fSearch" placeholder="Kurye Firması adı, bölge ara…" autocomplete="off">
        <div class="suggest-box" id="poolSuggest"></div>
      </div>
      <select id="fSelect1"><option value="">Tüm Bölgeler</option></select>
      <!-- Boş, gizli #fSelect2 KALDIRILDI: app.js onu yalnız type==="isletme"
           iken dolduruyor, burada hep boş kalıyordu. Var olan her element
           app.js'te sorgulanıp dinleyici bağlanıyordu — hiçbir işe yaramayan
           ölü işaretleme. -->
      <select id="fCapacity" onchange="filterByCapacity(this.value)">
        <option value="">Tüm Kapasiteler</option>
        <option value="small">1–10 Kurye</option>
        <option value="medium">11–50 Kurye</option>
        <option value="large">50+ Kurye</option>
      </select>
      <!-- "Match Skoru" KALDIRILDI — firma kartları .match-score elemanı
           basmıyor, arkasında hesap yok; üstelik VARSAYILAN seçenekti,
           yani sayfa hiçbir zaman sıralanmıyordu. -->
      <select id="fSort" onchange="sortPool(this.value)">
        <option value="rating">En Yüksek Puan</option>
        <option value="capacity">En Yüksek Kapasite</option>
      </select>
    </div>

    <div class="active-chips" id="poolChips"></div>

    <div class="cards-grid" id="poolGrid">
      <div class="skel-card"><div class="skel-card__top"><span class="skel skel--ava"></span><span class="skel-card__body"><span class="skel skel--line"></span><span class="skel skel--line"></span></span></div><span class="skel skel--chips"></span></div>
      <div class="skel-card"><div class="skel-card__top"><span class="skel skel--ava"></span><span class="skel-card__body"><span class="skel skel--line"></span><span class="skel skel--line"></span></span></div><span class="skel skel--chips"></span></div>
      <div class="skel-card"><div class="skel-card__top"><span class="skel skel--ava"></span><span class="skel-card__body"><span class="skel skel--line"></span><span class="skel skel--line"></span></span></div><span class="skel skel--chips"></span></div>
      <div class="skel-card"><div class="skel-card__top"><span class="skel skel--ava"></span><span class="skel-card__body"><span class="skel skel--line"></span><span class="skel skel--line"></span></span></div><span class="skel skel--chips"></span></div>
    </div>

  </div>

  <div id="app-footer"></div>

  <script src="assets/js/i18n.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.2/dist/umd/supabase.js" integrity="sha384-OUpie84zd1LdwNlK9uJJQRwab0BLqo3eKYKFh7hSVL58FSk7wPp2l0kfUMIIoaQd" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="assets/js/supabase.js"></script>
  <script src="assets/js/presence.js"></script>
  <script src="assets/js/components.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/motion.js"></script>
  <script src="assets/js/push.js"></script>
  <script>
  (function () {
    var isListView = false;
    var toggleBtn  = document.getElementById('btnToggleView');

    if (toggleBtn) {
      toggleBtn.addEventListener('click', function () {
        isListView = !isListView;
        var grid = document.getElementById('poolGrid');
        if (grid) grid.classList.toggle('cards-grid--list', isListView);
        toggleBtn.textContent = isListView ? '⊞ Grid' : '⊟ Liste';
        try { localStorage.setItem('kb_pool_view_firma', isListView ? 'list' : 'grid'); } catch (e) {}
      });
      try { if (localStorage.getItem('kb_pool_view_firma') === 'list') toggleBtn.click(); } catch (e) {}
    }

    /* Kapasite süzmesi ve sıralama app.js'e devredildi — ikisi de artık
       profilin `kapasite` SAYISINI okuyor, kartın metnini değil.

       Eski kod kart metninde /(\d+)\s*kurye/i arıyordu ve üç ayrı şekilde
       bozuktu:
         1) Rozet i18n'den geliyor. İngilizce'de "{n} courier capacity"
            yazdığı için regex hiçbir şey bulamıyor, hem süzme hem
            sıralama sessizce ölüyordu.
         2) Regex metindeki İLK sayıyı alıyor. Adında sayı geçen bir firma
            ("Hız 7 Kurye Lojistik") kendi kapasitesi yerine adındaki
            sayıyla süzülüp sıralanıyordu.
         3) app.js grid'i her yeniden yazdığında (arama, bölge filtresi,
            canlı abonelik) sonuç siliniyor ama açılır menü eski seçimi
            göstermeye devam ediyordu.
       Ayrıntı: app.js → POOLV. */
    window.filterByCapacity = function (val) {
      if (window.KBApp && KBApp.setPoolKapasite) KBApp.setPoolKapasite(val);
    };

    window.sortPool = function (mode) {
      if (window.KBApp && KBApp.setPoolSort) KBApp.setPoolSort(mode);
    };

    document.addEventListener('DOMContentLoaded', function () {
      if (window.KBApp && KBApp.renderPool) {
        /* Sonuç sayısını app.js doğrudan şeritteki #resultCount elemanına
           yazıyor; ayrı bir kopyalama gerekmiyor. Eskiden aynı cümle hem
           şeritte hem filtrenin altında iki kez görünüyordu.
           İkinci argüman: menüde seçili gelen sıralama. */
        KBApp.renderPool('firma', 'rating');
      }
    });
  })();
  </script>
</body>
</html>
