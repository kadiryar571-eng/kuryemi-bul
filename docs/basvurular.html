<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <!-- Content-Security-Policy — host allow-list.
       'unsafe-inline' kaldırılamaz (site inline onclick= handler'larına dayanır);
       asıl XSS savunması KB.esc()'tir. CSP burada veri sızdırmayı engeller:
       enjekte edilen kod çalınan oturum jetonunu dış sunucuya POST edemez. -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src  'self' 'unsafe-inline' https://cdn.jsdelivr.net;
    style-src   'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src    'self' https://fonts.gstatic.com data:;
    img-src     'self' data: blob: https://fdszypytpodndtlbuzuz.supabase.co;
    media-src   'self' blob: mediastream:;
    connect-src 'self' https://fdszypytpodndtlbuzuz.supabase.co wss://fdszypytpodndtlbuzuz.supabase.co;
    frame-src   'none';
    object-src  'none';
    base-uri    'self';
    form-action 'self';
  ">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Başvurular · KuryemiBul</title>
  <link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="assets/favicon-64.png" sizes="64x64" type="image/png">
  <link rel="icon" href="assets/logo.png" sizes="any">
  <link rel="apple-touch-icon" href="assets/logo.png">
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>

  <div id="app-topbar"></div>
  <div id="sidebar-overlay"></div>
  <nav id="app-sidebar"></nav>

  <div class="app-content">

    <div class="page-header page-header--row">
      <div>
        <h1>Başvurular</h1>
        <p class="page-sub">İlanına gelen adayları burada yönet.</p>
      </div>
      <a href="ilan-olustur.html" class="btn btn--primary btn--sm">+ Yeni İlan Oluştur</a>
    </div>

    <!-- Job selector -->
    <div id="apcJobBar" class="apc-job-bar">
      <div class="skel skel--line skel--tab" style="width:200px"></div>
      <div class="skel skel--line skel--tab" style="width:180px"></div>
    </div>

    <!-- Stats -->
    <div id="apcStats" class="apc-stats" style="display:none"></div>

    <!-- Controls -->
    <div id="apcControls" class="mb-12" style="display:none">
      <div class="filter-bar">
        <input type="search" id="apcSearch" placeholder="Aday adı ara…" class="search-grow">
        <select id="fBolge"><option value="">Tüm Bölgeler</option></select>
        <select id="fArac"><option value="">Tüm Araçlar</option></select>
        <select id="fDeneyim">
          <option value="">Tüm Deneyimler</option>
          <option value="1">1+ yıl</option>
          <option value="3">3+ yıl</option>
          <option value="5">5+ yıl</option>
        </select>
        <select id="fBelge">
          <option value="">Tüm Belgeler</option>
          <option value="onaylandi">Belgeler Onaylı</option>
          <option value="tam">Belgeler Var</option>
          <option value="eksik">Belgeler Eksik</option>
        </select>
        <select id="fSort">
          <option value="match">En Uyumlu</option>
          <option value="yeni">En Yeni</option>
          <option value="deneyim">En Deneyimli</option>
        </select>
      </div>
    </div>

    <!-- Tab bar -->
    <div class="tab-bar mb-16" id="apcTabBar" style="display:none">
      <button data-apctab="all" class="is-active">Tüm Başvurular <span id="apcAllBadge" class="kb-badge kb-badge--primary">0</span></button>
      <button data-apctab="shortlist">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:4px"><polygon points="12 2 15.1 8.3 22 9.3 17 14.1 18.2 21 12 17.8 5.8 21 7 14.1 2 9.3 8.9 8.3 12 2"/></svg>
        Kısa Liste <span id="apcSlBadge" class="kb-badge kb-badge--warning">0</span>
      </button>
    </div>

    <!-- Applicant grid -->
    <div id="apcGrid" class="apc-grid">
      <div class="apc-empty">
        <div class="apc-empty__ico">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/><path d="m9 14 2 2 4-4"/></svg>
        </div>
        <div class="apc-empty__t">Yukarıdan bir ilan seçin</div>
        <div class="apc-empty__s">Başvuruları yönetmek için bir ilanınızı seçin</div>
      </div>
    </div>

  </div><!-- /.app-content -->

  <div id="app-footer"></div>

  <!-- Profile detail modal -->
  <div class="modal-overlay" id="apcModalOverlay" style="display:none">
    <div class="modal apc-modal" id="apcModal"></div>
  </div>

  <script src="assets/js/i18n.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.2/dist/umd/supabase.js" integrity="sha384-OUpie84zd1LdwNlK9uJJQRwab0BLqo3eKYKFh7hSVL58FSk7wPp2l0kfUMIIoaQd" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="assets/js/supabase.js"></script>
  <script src="assets/js/presence.js"></script>
  <script src="assets/js/components.js"></script>
  <script src="assets/js/ilan-status.js"></script>
  <script src="assets/js/chat.js"></script>
  <script src="assets/js/hiring.js"></script>
  <script src="assets/js/notifications.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/motion.js"></script>
  <script src="assets/js/push.js"></script>
  <script>
  (function() {
    'use strict';

    /* ── State ── */
    var SEL_JOB_ID = (new URLSearchParams(location.search).get('job') || '');
    var CUR_TAB    = 'all';
    var FILTERS    = { bolge:'', arac:'', deneyim:'', belge:'', sort:'match', q:'' };
    var ALL_JOBS   = [];
    var CUR_APPS   = [];
    var JOB_COUNTS = {};   // { listingId: gerçek başvuru adedi }
    var LIVE_OFF   = null; // realtime aboneliğini kapatma fonksiyonu

    /* ── Helpers ── */
    function simpleHash(s) {
      var h = 0, str = String(s);
      for (var i = 0; i < str.length; i++) h = (Math.imul(31, h) + str.charCodeAt(i)) | 0;
      return Math.abs(h);
    }
    function normStr(s) {
      s = String(s || '').normalize('NFD'); var o = '';
      for (var i = 0; i < s.length; i++) { var c = s.charCodeAt(i); if (c >= 0x300 && c <= 0x36f) continue; o += s.charAt(i); }
      return o.toLowerCase().trim();
    }
    /* Merkezî kaçışa delege eder (components.js → KB.esc).
       Yerel kopya TEK TIRNAĞI kaçırmıyordu — CLAUDE.md §1 bunu adıyla
       yasaklıyor. Bu sayfa kaçırdığı değerleri data-* niteliklerine de
       yazıyor, o yüzden eksik kaçış burada gerçekten önemliydi. */
    function esc(s) {
      if (window.KB && KB.esc) return KB.esc(s);
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
      });
    }
    function getUid() {
      try { if (window.KB && KB.session) { var s = KB.session(); if (s && s.user && s.user.id) return s.user.id; } } catch(e) {}
      return null;   // uydurma 'demo' kimliği kaldırıldı
    }
    function relTime(dateStr) {
      if (!dateStr) return '';
      var n = Math.floor((Date.now() - new Date(dateStr).getTime()) / 86400000);
      if (n === 0) return 'Bugün';
      if (n === 1) return 'Dün';
      return n + ' gün önce';
    }

    /* ── Status map ── */
    var STATUS = {
      yeni:             { lbl:'Yeni Başvuru',     cls:'chip--apc-yeni',    ico:'<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="jc-ico"><path d="M12 2v4M12 18v4M4.9 4.9l2.9 2.9M16.2 16.2l2.9 2.9M2 12h4M18 12h4M4.9 19.1l2.9-2.9M16.2 7.8l2.9-2.9"</svg>' },
      inceleniyor:      { lbl:'İnceleniyor',      cls:'chip--apc-incel',   ico:'<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="jc-ico"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>' },
      mesaj_gonderildi: { lbl:'Mesaj Gönderildi', cls:'chip--apc-msg',     ico:'<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="jc-ico"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>' },
      mulakat:          { lbl:'Mülakat Aşaması',  cls:'chip--apc-mulakat', ico:'<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="jc-ico"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2 4.2 2 2 0 0 1 4 2h3a2 2 0 0 1 2 1.7c.1 1 .3 1.9.6 2.8a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.2-1.1a2 2 0 0 1 2.1-.5c.9.3 1.8.5 2.8.6A2 2 0 0 1 22 16.9z"</svg>' },
      kabul:            { lbl:'Kabul Edildi',      cls:'chip--apc-kabul',   ico:'✓'  },
      red:              { lbl:'Reddedildi',        cls:'chip--apc-red',     ico:'✗'  }
    };
    function statusChip(st) {
      var s = STATUS[st] || STATUS.yeni;
      return '<span class="chip ' + s.cls + '">' + s.ico + ' ' + s.lbl + '</span>';
    }
    function matchCls(score) {
      return score >= 70 ? 'match-high' : score >= 45 ? 'match-mid' : 'match-low';
    }

    /* ── Data helpers — TAMAMI VERİTABANINDAN ──
       Bu ekranda üretilmiş/örnek aday YOKTUR. İlanlar SB.myListings(),
       başvuranlar SB.listingApplications() ile gerçek kayıtlardan gelir. */
    async function loadJobs() {
      ALL_JOBS = [];
      if (!(window.SB && SB.isOn())) return;
      try { ALL_JOBS = await SB.myListings(); } catch(e) { console.warn('myListings:', e); }
    }

    function getJob(id) {
      for (var i = 0; i < ALL_JOBS.length; i++) { if (String(ALL_JOBS[i].id) === String(id)) return ALL_JOBS[i]; }
      return null;
    }

    /* İlan başına gerçek başvuru adedi */
    async function refreshJobCounts() {
      JOB_COUNTS = {};
      if (!(window.SB && SB.isOn()) || !ALL_JOBS.length) return;
      try {
        JOB_COUNTS = await SB.listingAppCounts(ALL_JOBS.map(function(j) { return j.id; }));
      } catch(e) {}
      ALL_JOBS.forEach(function(j) { if (JOB_COUNTS[j.id] == null) JOB_COUNTS[j.id] = 0; });
    }

    function profilePct(k) {
      var pts = 0;
      if (k.ad) pts += 15; if (k.sehir) pts += 15; if (k.arac) pts += 15;
      if (k.deneyim > 0) pts += 15; if (k.aciklama) pts += 15;
      if (k.sertifikalar && k.sertifikalar.length) pts += 15;
      if (k.referanslar && k.referanslar.length) pts += 10;
      return Math.min(100, pts);
    }

    function docStatus(k) {
      if (!k.sertifikalar || !k.sertifikalar.length)
        return { lbl:'Belgeler Eksik', cls:'chip--apc-incel', key:'eksik' };
      if (k.sertifikalar.some(function(c) { return c.indexOf('MYK') !== -1; }))
        return { lbl:'✓ Belgeler Onaylı', cls:'chip--apc-kabul', key:'onaylandi' };
      return { lbl:'Belgeler Var', cls:'chip--apc-yeni', key:'tam' };
    }

    function calcMatch(k, job) {
      if (!job) return 50;
      var s = 0;
      if (k.sehir && job.sehir && normStr(k.sehir) === normStr(job.sehir)) s += 30;
      if (k.arac && job.arac) {
        var ka = normStr(k.arac).split(' ')[0], ja = normStr(job.arac).split(' ')[0];
        if (ka === ja || ka.indexOf(ja) !== -1 || ja.indexOf(ka) !== -1) s += 25;
      }
      if (k.deneyim >= 2) s += 15;
      if (k.sertifikalar && k.sertifikalar.length) s += 15;
      return Math.min(100, s);
    }

    /* Gerçek başvurular. DB'deki durum (pending/accepted/rejected) tek doğrudur;
       "inceleniyor / mesaj gönderildi / kısa liste" gibi ara adımlar işverenin
       kendi çalışma notudur ve GERÇEK başvuru id'si ile saklanır. */
    function dbToUi(durum, sv) {
      if (durum === 'accepted') return 'kabul';
      if (durum === 'rejected') return 'red';
      return sv && sv.status && ['inceleniyor','mesaj_gonderildi','kisa_listede','mulakat'].indexOf(sv.status) !== -1
        ? sv.status : 'yeni';
    }
    async function loadApps(jobId) {
      if (!(window.SB && SB.isOn()) || !jobId) return [];
      var job = getJob(jobId);
      var rows = [];
      try { rows = await SB.listingApplications(jobId); }
      catch(e) { console.warn('listingApplications:', e); return []; }
      var saved = {};
      try { saved = JSON.parse(localStorage.getItem('kb_apps_' + jobId)) || {}; } catch(e) {}
      return rows.map(function(r) {
        var sv = saved[r.id] || {};
        // Aday profili — tamamı DB'den
        var k = {
          id: r.applicantId, ad: r.ad, sehir: r.sehir, arac: r.arac,
          bolgeler: r.bolgeler, deneyim: r.deneyim,
          sertifikalar: r.sertifikalar, tamamlanan: r.tamamlanan, puan: r.puan,
          aciklama: r.aciklama, avatar_url: r.avatar_url, dogrulama: r.dogrulama,
          calistigi: r.calistigi, referanslar: []
        };
        return {
          appId:      r.id,           // gerçek applications.id
          k:          k,
          jobId:      jobId,
          mesaj:      r.mesaj || '',
          status:     dbToUi(r.durum, sv),
          dbDurum:    r.durum,
          shortlisted:!!sv.shortlisted,
          date:       r.tarih,
          viewed:     !!sv.viewed,
          match:      calcMatch(k, job),
          pct:        profilePct(k),
          doc:        docStatus(k)
        };
      });
    }

    /* İşverenin kendi iş akışı notu (kısa liste / görüldü) — gerçek başvuru id'si ile */
    function saveApp(jobId, appId, patch) {
      var key = 'kb_apps_' + jobId, saved = {};
      try { saved = JSON.parse(localStorage.getItem(key)) || {}; } catch(e) {}
      saved[appId] = Object.assign(saved[appId] || {}, patch);
      try { localStorage.setItem(key, JSON.stringify(saved)); } catch(e) {}
    }

    function logActivity(jobId, kId, event, note) {
      var key = 'kb_apc_log_' + jobId, log = [];
      try { log = JSON.parse(localStorage.getItem(key)) || []; } catch(e) {}
      log.unshift({ event:event, kId:kId, note:note||'', date:new Date().toISOString() });
      try { localStorage.setItem(key, JSON.stringify(log.slice(0, 200))); } catch(e) {}
    }

    /* Adaya bildirim GÖNDERİLMEZ (istemciden): başvuru kabul/red edildiğinde
       bildirimi Supabase trigger'ı (kb_application_update) adayın kendi
       hesabına üretir. Böylece bildirim gerçek olaydan doğar ve doğru
       kullanıcıya ulaşır. */

    /* ── Filters ── */
    function applyFilters(apps) {
      var f = FILTERS;
      return apps.filter(function(a) {
        if (CUR_TAB === 'shortlist' && !a.shortlisted) return false;
        if (f.q) {
          var q = normStr(f.q);
          if (normStr(a.k.ad).indexOf(q) === -1) return false;
        }
        if (f.bolge) {
          var bMatch = (a.k.bolgeler || []).some(function(b) { return normStr(b).indexOf(normStr(f.bolge)) !== -1; });
          if (!bMatch) return false;
        }
        if (f.arac && normStr(a.k.arac) !== normStr(f.arac)) return false;
        if (f.deneyim) {
          var min = parseInt(f.deneyim, 10) || 0;
          if ((a.k.deneyim || 0) < min) return false;
        }
        if (f.belge && a.doc.key !== f.belge) return false;
        return true;
      }).sort(function(a, b) {
        if (f.sort === 'match')   return b.match - a.match;
        if (f.sort === 'deneyim') return (b.k.deneyim || 0) - (a.k.deneyim || 0);
        if (f.sort === 'yeni')    return b.date > a.date ? 1 : -1;
        return 0;
      });
    }

    /* ── Render: job bar ── */
    function renderJobBar() {
      var el = document.getElementById('apcJobBar');
      if (!el) return;
      if (!ALL_JOBS.length) {
        el.innerHTML = '<div class="apc-empty"><div class="apc-empty__ico"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/></svg></div>' +
          '<div class="apc-empty__t">Henüz yayında ilanınız yok</div>' +
          '<a href="ilan-olustur.html" class="btn btn--primary btn--sm" style="margin-top:12px">+ İlan Oluştur</a></div>';
        return;
      }
      el.innerHTML = ALL_JOBS.map(function(j) {
        // Gerçek başvuru adedi (SB.listingAppCounts ile dolduruldu)
        var count  = JOB_COUNTS[j.id] != null ? JOB_COUNTS[j.id] : 0;
        // Seçili ilanda gerçekten bekleyen (pending) başvuru sayısı
        var newCnt = (String(SEL_JOB_ID) === String(j.id))
          ? CUR_APPS.filter(function(a) { return a.dbDurum === 'pending'; }).length : 0;
        var statusBadge = window.IlanStatus ? IlanStatus.renderBadge(j.durum || 'yayinda') : '';
        return '<button class="apc-job-btn' + (SEL_JOB_ID === j.id ? ' is-active' : '') + '" data-jobid="' + esc(j.id) + '">' +
          '<div>' +
            '<div class="apc-job-btn__name">' + esc(j.baslik || 'İsimsiz İlan') + '</div>' +
            '<div style="margin-top:5px;display:flex;align-items:center;gap:6px">' +
              statusBadge +
              (j.sehir ? '<span style="font-size:0.71rem;color:var(--text-3)"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="jc-ico"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg> ' + esc(j.sehir) + '</span>' : '') +
            '</div>' +
          '</div>' +
          '<span class="apc-job-btn__count' + (count ? '' : ' apc-job-btn__count--zero') + '">' + count + ' aday</span>' +
          (newCnt > 0 ? '<span style="position:absolute;top:-7px;right:-7px;background:var(--error);color:#fff;border-radius:50%;min-width:18px;height:18px;font-size:0.65rem;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 3px">' + newCnt + '</span>' : '') +
        '</button>';
      }).join('');
    }

    /* ── Render: stats ── */
    function renderStats() {
      var el = document.getElementById('apcStats');
      if (!el) return;
      var apps = CUR_APPS;
      var total = apps.length;
      var newC  = apps.filter(function(a) { return a.status === 'yeni'; }).length;
      var sl    = apps.filter(function(a) { return a.shortlisted; }).length;
      var acc   = apps.filter(function(a) { return a.status === 'kabul'; }).length;
      var rej   = apps.filter(function(a) { return a.status === 'red'; }).length;
      el.style.display = '';
      el.innerHTML =
        '<div class="apc-stat"><div class="apc-stat__val">' + total + '</div><div class="apc-stat__lbl">Toplam</div></div>' +
        '<div class="apc-stat apc-stat--blue"><div class="apc-stat__val">' + newC + '</div><div class="apc-stat__lbl">Yeni</div></div>' +
        '<div class="apc-stat apc-stat--yellow"><div class="apc-stat__val">' + sl + '</div><div class="apc-stat__lbl">Kısa Liste</div></div>' +
        '<div class="apc-stat apc-stat--green"><div class="apc-stat__val">' + acc + '</div><div class="apc-stat__lbl">Kabul</div></div>' +
        '<div class="apc-stat apc-stat--red"><div class="apc-stat__val">' + rej + '</div><div class="apc-stat__lbl">Red</div></div>';
      var allBadge = document.getElementById('apcAllBadge');
      var slBadge  = document.getElementById('apcSlBadge');
      if (allBadge) allBadge.textContent = total;
      if (slBadge)  slBadge.textContent  = sl;
    }

    /* ── Render: single card ── */
    function renderCard(a) {
      var k     = a.k;
      var inits = (k.ad || '?').split(' ').map(function(w) { return w[0]; }).slice(0, 2).join('').toUpperCase() || '?';
      var bTxt  = (k.bolgeler || []).slice(0, 2).join(', ');
      var mCls  = matchCls(a.match);
      var cardCls = 'apc-card' + (a.shortlisted ? ' is-shortlisted' : '') +
                    (a.status === 'kabul' ? ' is-accepted' : a.status === 'red' ? ' is-rejected' : '');

      return '<div class="' + cardCls + '" data-kid="' + esc(k.id) + '" data-jobid="' + esc(a.jobId) + '">' +

        '<div class="apc-card__head">' +
          '<div class="apc-card__av">' +
            (k.avatar_url ? '<img src="' + esc(k.avatar_url) + '" alt="">' : inits) +

          '<div class="apc-card__info">' +
            '<div class="apc-card__name">' + esc(k.ad || '—') + '</div>' +
            '<div class="apc-card__sub"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="jc-ico"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg> ' + esc(k.sehir || '') + (bTxt ? ' · ' + esc(bTxt) : '') +

        '<div class="apc-card__details">' +
          (k.arac      ? '<div class="apc-detail"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="jc-ico"><circle cx="5.5" cy="17.5" r="2.5"/><circle cx="18.5" cy="17.5" r="2.5"/><path d="M8 17.5h7.5"/><path d="M5.5 15L9 7h4.5l3 5.5-4.5 2.5"/></svg> <span>' + esc(k.arac) + '</span></div>' : '') +
          (bTxt        ? '<div class="apc-detail"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="jc-ico"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg> <span>' + esc(bTxt) + '</span></div>' : '') +

          (k.tamamlanan? '<div class="apc-detail"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="jc-ico"><path d="M21 16V8a2 2 0 0 0-1-1.7l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.7l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="m3.3 7 8.7 5 8.7-5"/></svg> <span>' + k.tamamlanan + ' teslimat</span></div>' : '') +

        '<div class="apc-card__acts">' +
          '<button class="btn btn--ghost btn--sm" data-apc-action="profile"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="jc-ico"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> Profili Gör</button>' +
          '<button class="btn btn--ghost btn--sm" data-apc-action="message"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="jc-ico"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg> Mesaj</button>' +

          (a.status !== 'kabul' && a.status !== 'red' ?
            '<button class="btn btn--success btn--sm" data-apc-action="accept">✓ Kabul</button>' +

    /* ── Render: grid ── */
    function renderGrid() {
      var el = document.getElementById('apcGrid');

        el.innerHTML = '<div class="apc-empty"><div class="apc-empty__ico"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/><path d="m9 14 2 2 4-4"/></svg></div>' +
          '<div class="apc-empty__t">Yukarıdan bir ilan seçin</div>' +
          '<div class="apc-empty__s">Başvuruları görmek için ilanınızı seçin</div></div>';
        return;
      }
      var filtered = applyFilters(CUR_APPS);
      if (!filtered.length) {
        var emptyMsg = CUR_TAB === 'shortlist'
          ? '<div class="apc-empty__ico">⭐</div><div class="apc-empty__t">Kısa liste boş</div><div class="apc-empty__s">Adayları kısa listeye eklemek için ☆ Kısa Liste butonunu kullanın</div>'
          : '<div class="apc-empty__ico"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></div><div class="apc-empty__t">Başvuru bulunamadı</div><div class="apc-empty__s">Filtre kriterlerinizi değiştirin</div>';
        el.innerHTML = '<div class="apc-empty">' + emptyMsg + '</div>';
        return;
      }
      el.innerHTML = filtered.map(renderCard).join('');
    }

    /* ── Profile modal ── */
    function openModal(kid, jobId) {
      var app = CUR_APPS.filter(function(a) { return a.k.id === kid; })[0];
      if (!app) return;
      var k   = app.k;
      var job = getJob(jobId);
      var inits = (k.ad || '?').split(' ').map(function(w) { return w[0]; }).slice(0, 2).join('').toUpperCase() || '?';
      var mCls  = matchCls(app.match);
      var mColor = app.match >= 70 ? '#15803D' : app.match >= 45 ? 'var(--warning)' : 'var(--error)';

      /* mark viewed & auto-update status */
      if (!app.viewed) {
        app.viewed = true;
        saveApp(jobId, app.appId, { viewed:true });
        // Adayın profilini gerçekten görüntüledik → gerçek görüntülenme kaydı
        // (sunucu adayın hesabına bildirim üretir)
        if (window.SB && SB.recordProfileView) SB.recordProfileView(k.id);
        if (app.status === 'yeni') {
          app.status = 'inceleniyor';
          saveApp(jobId, app.appId, { status:'inceleniyor' });
          logActivity(jobId, app.appId, 'viewed', k.ad + ' profili incelendi');
          renderGrid();
          renderStats();
        }
      }

      var certsHtml = (k.sertifikalar || []).length
        ? (k.sertifikalar.map(function(c) {
            return '<span class="apc-cert' + (c.indexOf('MYK') !== -1 ? ' apc-cert--mkv' : '') + '"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="jc-ico"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg> ' + esc(c) + '</span>';
          }).join(''))
        : '<span class="text-muted-sm">Sertifika bulunmuyor</span>';

      var expHtml = (k.calistigi || []).length
        ? (k.calistigi.map(function(c) {
            return '<div style="padding:8px 12px;background:var(--surface-2);border-radius:var(--radius);margin-bottom:6px;font-size:0.875rem">🏢 ' + esc(c) + '</div>';
          }).join(''))
        : '<span class="text-muted-sm">Geçmiş iş bilgisi yok</span>';

      var refHtml = (k.referanslar || []).length
        ? (k.referanslar.map(function(r) {
            return '<div style="padding:10px 14px;background:var(--surface-2);border-radius:var(--radius);margin-bottom:8px">' +
              '<div style="font-weight:600;font-size:0.875rem">' + esc(r.ad) + ' <span style="font-size:0.75rem;color:var(--text-3)">· ' + esc(r.rol) + '</span></div>' +
              '<div style="font-size:0.82rem;color:var(--text-2);margin-top:4px;font-style:italic">"' + esc(r.not) + '"</div></div>';
          }).join(''))
        : '<span class="text-muted-sm">Referans bulunmuyor</span>';

      var modalEl = document.getElementById('apcModal');
      if (!modalEl) return;

      modalEl.innerHTML =
        /* ─ Head ─ */
        '<div class="apc-mhead">' +
          '<div class="apc-mhead__av">' + (k.avatar_url ? '<img src="' + esc(k.avatar_url) + '" alt="" style="width:100%;height:100%;object-fit:cover">' : inits) + '</div>' +
          '<div class="apc-mhead__body">' +
            '<div class="apc-mhead__name">' + esc(k.ad || '—') + '</div>' +
            '<div class="apc-mhead__meta"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="jc-ico"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg> ' + esc(k.sehir || '') + ((k.bolgeler || []).length ? ' · ' + k.bolgeler.slice(0, 2).map(esc).join(', ') : '') + '</div>' +
            '<div class="apc-mhead__stats">' +
              (k.deneyim ? '<div class="apc-mhead__stat"><div class="apc-mhead__stat-val">' + k.deneyim + '</div><div class="apc-mhead__stat-lbl">Yıl Deneyim</div></div>' : '') +
              (k.tamamlanan ? '<div class="apc-mhead__stat"><div class="apc-mhead__stat-val">' + k.tamamlanan + '</div><div class="apc-mhead__stat-lbl">Teslimat</div></div>' : '') +
              (k.puan ? '<div class="apc-mhead__stat"><div class="apc-mhead__stat-val">⭐ ' + k.puan + '</div><div class="apc-mhead__stat-lbl">Puan</div></div>' : '') +
            '</div>' +
          '</div>' +
          '<div class="apc-mhead__match">' +
            '<div style="font-size:1.5rem;font-weight:700;color:' + mColor + '">%' + app.match + '</div>' +
            '<div style="font-size:0.68rem;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em">Uyum</div>' +
            '<div style="font-size:0.75rem;color:var(--text-2);margin-top:4px">' + statusChip(app.status) + '</div>' +
          '</div>' +
        '</div>' +

        /* ─ Sections ─ */
        '<div class="apc-msec"><h3>Kişisel Bilgiler</h3><dl class="apc-mkv">' +
          '<dt>Şehir</dt><dd>' + esc(k.sehir || '—') + '</dd>' +
          ((k.bolgeler || []).length ? '<dt>Çalışma Bölgeleri</dt><dd>' + k.bolgeler.map(esc).join(', ') + '</dd>' : '') +
          '<dt>Profil Tamamlama</dt><dd>%' + app.pct + '</dd>' +
          '<dt>Belge Durumu</dt><dd>' + app.doc.lbl + '</dd>' +
        '</dl></div>' +

        '<div class="apc-msec"><h3>Çalışma Bilgileri</h3><dl class="apc-mkv">' +
          '<dt>Araç</dt><dd>' + esc(k.arac || '—') + '</dd>' +
          '<dt>Deneyim</dt><dd>' + (k.deneyim ? k.deneyim + ' yıl' : '—') + '</dd>' +
          '<dt>Tamamlanan Teslimat</dt><dd>' + (k.tamamlanan || '—') + '</dd>' +
          '<dt>Ortalama Puan</dt><dd>' + (k.puan ? '⭐ ' + k.puan : '—') + '</dd>' +
        '</dl></div>' +

        '<div class="apc-msec"><h3>Sertifikalar &amp; Belgeler</h3>' + certsHtml + '</div>' +
        '<div class="apc-msec"><h3>Geçmiş İş Deneyimi</h3>' + expHtml + '</div>' +
        '<div class="apc-msec"><h3>Referanslar</h3>' + refHtml + '</div>' +
        (k.aciklama ? '<div class="apc-msec"><h3>Hakkında</h3><p style="font-size:0.875rem;color:var(--text-2);line-height:1.7">' + esc(k.aciklama) + '</p></div>' : '') +

        /* ─ Footer ─ */
        '<div class="apc-mfoot">' +
          '<a class="btn btn--ghost btn--sm" href="profil-kurye.html?id=' + esc(k.id) + '" target="_blank" rel="noopener"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="jc-ico"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg> Profil Sayfası</a>' +
          '<button class="btn btn--ghost btn--sm" data-modal-action="message" data-kid="' + esc(k.id) + '" data-jobid="' + esc(jobId) + '">💬 Mesaj Gönder</button>' +
          '<button class="btn btn--ghost btn--sm" data-modal-action="shortlist" data-kid="' + esc(k.id) + '" data-jobid="' + esc(jobId) + '">' + (app.shortlisted ? '★ Listeden Çıkar' : '☆ Kısa Listeye Ekle') + '</button>' +
          (app.status !== 'kabul' && app.status !== 'red' ?
            '<button class="btn btn--primary btn--sm" data-modal-action="accept" data-kid="' + esc(k.id) + '" data-jobid="' + esc(jobId) + '">✓ Kabul Et</button>' +
            '<button class="btn btn--danger btn--sm" data-modal-action="reject" data-kid="' + esc(k.id) + '" data-jobid="' + esc(jobId) + '">✗ Reddet</button>'
            : statusChip(app.status)) +
          '<button class="btn btn--ghost btn--sm" data-modal-action="close" style="margin-left:auto">✕ Kapat</button>' +
        '</div>';

      var overlay = document.getElementById('apcModalOverlay');
      if (overlay) { overlay.style.display = 'flex'; document.body.style.overflow = 'hidden'; }
    }

    function closeModal() {
      var ov = document.getElementById('apcModalOverlay');
      if (ov) { ov.style.display = 'none'; document.body.style.overflow = ''; }
    }

    /* Open (or create) a chat thread for this applicant, then navigate */
    function openChat(kid, jobId) {
      if (!window.KBChat) { window.location.href = 'mesajlar.html'; return; }
      var job  = getJob(jobId);
      var app  = CUR_APPS.filter(function(a) { return a.k.id === kid; })[0];
      var k    = app ? app.k : { id: kid, ad: 'Kurye', avatar: '' };
      var uid  = getUid();
      var thread = KBChat.ensureThread(uid, jobId, kid, {
        jobTitle:  job ? (job.baslik || job.poz_baslik || 'İlan') : 'İlan',
        kurye:     { id: kid, ad: k.ad || 'Kurye', avatar: '' },
        isletmeId: uid,
        isletme:   { id: uid, ad: (job && (job.isletme_adi || job.firma_adi)) || 'Esnaf', avatar: '' },
        appStatus: app ? (app.status || 'inceleniyor') : 'inceleniyor',
        createdAt: app ? (app.date || new Date().toISOString()) : new Date().toISOString()
      });
      /* also update app status to "mesaj_gonderildi" if still new */
      if (app && app.status === 'yeni') {
        saveApp(jobId, kid, { status: 'mesaj_gonderildi' });
        app.status = 'mesaj_gonderildi';
      }
      window.location.href = 'mesajlar.html?tid=' + encodeURIComponent(thread.id);
    }

    /* Navigate to hiring decision page for this applicant */
    async function openDecision(kid, jobId) {
      var job = getJob(jobId);
      var app = CUR_APPS.filter(function(a) { return a.k.id === kid; })[0];
      var k   = app ? app.k : { id: kid, ad: 'Kurye', avatar: '' };
      var uid = getUid();

      /* Karar kaydını veritabanında aç (yoksa) — karar.html oradan okur.
         İsim/başlık gibi alanlar DB join'inden gelir, elle taşınmaz. */
      if (window.KBHiring) {
        await KBHiring.load();
        if (!KBHiring.getDecision(jobId, kid)) {
          await KBHiring.makeDecision(null, jobId, kid, 'beklemede', {
            application_id: app ? app.appId : null
          });
        }
      }

      var params = '?job=' + encodeURIComponent(jobId) + '&kid=' + encodeURIComponent(kid);
      if (job) params += '&title=' + encodeURIComponent(job.baslik || job.poz_baslik || '');
      window.location.href = 'karar.html' + params;
    }

    /* ── Actions ── */
    /* Kabul/Red VERİTABANINA yazılır (applications.durum). Adayın bildirimi
       ve konuşma akışı sunucu trigger'larıyla otomatik tetiklenir. */
    async function setStatus(jobId, kid, status) {
      var app = CUR_APPS.filter(function(a) { return a.k.id === kid; })[0];
      if (!app) return;

      var dbMap = { kabul:'accepted', red:'rejected' };
      if (dbMap[status]) {
        if (!(window.SB && SB.isOn())) {
          if (window.KBMotion) KBMotion.showErrorToast('Bağlantı yok — durum kaydedilemedi');
          return;
        }
        var r = await SB.updateApplication(app.appId, dbMap[status]);
        if (r && r.error) {
          if (window.KBMotion) KBMotion.showErrorToast(r.error.message || 'Durum güncellenemedi');
          return;
        }
        app.dbDurum = dbMap[status];
      } else {
        // Ara adımlar işverenin kendi çalışma notudur
        saveApp(jobId, app.appId, { status:status });
      }
      app.status = status;
      logActivity(jobId, app.appId, status, '');
      renderStats();
      renderGrid();
      if (window.KBMotion) {
        var M = { kabul:'✓ Kabul edildi — aday bilgilendirildi', red:'Başvuru reddedildi', mulakat:'Mülakat daveti gönderildi', inceleniyor:'İnceleniyor olarak işaretlendi', mesaj_gonderildi:'Mesaj durumu güncellendi' };
        KBMotion.showSuccess(M[status] || 'Durum güncellendi', '', 2000);
      }
    }

    function toggleShortlist(jobId, kid) {
      var app = CUR_APPS.filter(function(a) { return a.k.id === kid; })[0];
      if (!app) return;
      app.shortlisted = !app.shortlisted;
      saveApp(jobId, app.appId, { shortlisted:app.shortlisted });
      if (app.shortlisted) {
        logActivity(jobId, app.appId, 'shortlist', app.k.ad + ' kısa listeye eklendi');
        if (window.KBMotion) KBMotion.showSuccess('⭐ Kısa listeye eklendi', '', 1600);
      }
      renderStats();
      renderGrid();
    }

    /* ── Populate filter selects ── */
    function populateFilters(apps) {
      var bolgeSel = document.getElementById('fBolge');
      var aracSel  = document.getElementById('fArac');
      if (!bolgeSel || !aracSel) return;

      var bolges = {}, aracs = {};
      apps.forEach(function(a) {
        (a.k.bolgeler || []).forEach(function(b) { bolges[b] = 1; });
        if (a.k.arac) aracs[a.k.arac] = 1;
      });

      bolgeSel.innerHTML = '<option value="">Tüm Bölgeler</option>' +
        Object.keys(bolges).sort().map(function(b) { return '<option value="' + esc(b) + '">' + esc(b) + '</option>'; }).join('');
      aracSel.innerHTML  = '<option value="">Tüm Araçlar</option>' +
        Object.keys(aracs).sort().map(function(a) { return '<option value="' + esc(a) + '">' + esc(a) + '</option>'; }).join('');
    }

    /* ── Select job ── */
    async function selectJob(jobId) {
      SEL_JOB_ID = jobId;
      try {
        var url = new URL(location.href);
        url.searchParams.set('job', jobId);
        history.replaceState({}, '', url.toString());
      } catch(e) {}
      var grid = document.getElementById('apcGrid');
      if (grid) grid.innerHTML = '<div class="apc-empty"><div class="apc-empty__ico">⏳</div><div class="apc-empty__t">Başvurular yükleniyor…</div></div>';
      CUR_APPS = await loadApps(jobId);
      await refreshJobCounts();
      renderJobBar();
      renderStats();
      populateFilters(CUR_APPS);
      var ctrl   = document.getElementById('apcControls');
      var tabBar = document.getElementById('apcTabBar');
      if (ctrl)   ctrl.style.display   = '';
      if (tabBar) tabBar.style.display = '';
      renderGrid();
    }

    /* ── Wire events ── */
    function wire() {
      /* job bar */
      document.getElementById('apcJobBar').addEventListener('click', function(e) {
        var btn = e.target.closest('[data-jobid]');
        if (btn) selectJob(btn.dataset.jobid);
      });

      /* grid delegation */
      document.getElementById('apcGrid').addEventListener('click', function(e) {
        var card   = e.target.closest('[data-kid]');
        if (!card) return;
        var kid    = card.dataset.kid;
        var jobId  = card.dataset.jobid;
        var action = e.target.closest('[data-apc-action]');
        if (!action) return;
        var act    = action.dataset.apcAction;
        if (act === 'profile')   openModal(kid, jobId);
        else if (act === 'message')   openChat(kid, jobId);
        else if (act === 'shortlist') toggleShortlist(jobId, kid);
        else if (act === 'decide')    openDecision(kid, jobId);
        else if (act === 'accept')    setStatus(jobId, kid, 'kabul');
        else if (act === 'reject')    setStatus(jobId, kid, 'red');
        else if (act === 'setstatus') setStatus(jobId, kid, action.value);
      });

      /* grid – prevent select change from bubbling as a click */
      document.getElementById('apcGrid').addEventListener('change', function(e) {
        var sel = e.target.closest('[data-apc-action="setstatus"]');
        if (!sel) return;
        var card  = sel.closest('[data-kid]');
        if (!card) return;
        setStatus(card.dataset.jobid, card.dataset.kid, sel.value);
      });

      /* modal overlay */
      document.getElementById('apcModalOverlay').addEventListener('click', function(e) {
        if (e.target === this) { closeModal(); return; }
        var btn = e.target.closest('[data-modal-action]');
        if (!btn) return;
        var act   = btn.dataset.modalAction;
        var kid   = btn.dataset.kid;
        var jobId = btn.dataset.jobid;
        if (act === 'close')      closeModal();
        else if (act === 'message')   { closeModal(); openChat(kid, jobId); }
        else if (act === 'shortlist') { toggleShortlist(jobId, kid); closeModal(); }
        else if (act === 'accept')    { setStatus(jobId, kid, 'kabul'); closeModal(); }
        else if (act === 'reject')    { setStatus(jobId, kid, 'red');   closeModal(); }
      });

      /* tab bar */
      document.getElementById('apcTabBar').addEventListener('click', function(e) {
        var btn = e.target.closest('[data-apctab]');
        if (!btn) return;
        CUR_TAB = btn.dataset.apctab;
        document.querySelectorAll('[data-apctab]').forEach(function(b) {
          b.classList.toggle('is-active', b.dataset.apctab === CUR_TAB);
        });
        renderGrid();
      });

      /* filter selects */
      [['fBolge','bolge'],['fArac','arac'],['fDeneyim','deneyim'],['fBelge','belge'],['fSort','sort']].forEach(function(pair) {
        var el = document.getElementById(pair[0]);
        if (!el) return;
        el.addEventListener('change', function() { FILTERS[pair[1]] = this.value; renderGrid(); });
      });

      /* search */
      var searchEl = document.getElementById('apcSearch');
      if (searchEl) searchEl.addEventListener('input', function() { FILTERS.q = this.value; renderGrid(); });

      /* ESC */
      document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeModal(); });
    }

    /* ── Init ── */
    document.addEventListener('DOMContentLoaded', function() {
      if (window.KB && KB.ready) {
        KB.ready().then(function () { return window.KBChat ? KBChat.ready : null; }).then(function () { boot(); });
      } else {
        boot();
      }
    });

    async function boot() {
      if (window.IlanStatus) IlanStatus.autoCheck(getUid());
      var bar = document.getElementById('apcJobBar');
      if (bar) bar.innerHTML = '<div class="apc-empty"><div class="apc-empty__ico">⏳</div><div class="apc-empty__t">İlanlarınız yükleniyor…</div></div>';
      await loadJobs();
      await refreshJobCounts();
      renderJobBar();
      renderGrid();
      wire();
      if (SEL_JOB_ID) { await selectJob(SEL_JOB_ID); }
      wireLive();
    }

    /* CANLI: yeni başvuru gelince liste ve sayaçlar sayfa yenilemeden güncellenir */
    function wireLive() {
      if (LIVE_OFF || !(window.SB && SB.isOn() && SB.subscribeApplications)) return;
      var pending = null;
      LIVE_OFF = SB.subscribeApplications(function() {
        if (pending) clearTimeout(pending);
        pending = setTimeout(async function() {
          await refreshJobCounts();
          if (SEL_JOB_ID) CUR_APPS = await loadApps(SEL_JOB_ID);
          renderJobBar();
          renderStats();
          renderGrid();
        }, 500);
      });
    }

  })();
  </script>
</body>
</html>
